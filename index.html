<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAS Markets Pro | سيد الابتكار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* جميع تنسيقاتك الأصلية مدمجة هنا مع تحسينات طفيفة */
        :root{--p:#6366f1;--p2:#8b5cf6;--gold:#f59e0b;--ok:#10b981;--err:#ef4444;--bg:#f8fafc;--card:#fff;--txt:#0f172a;--muted:#64748b;--bd:#e2e8f0;}
        .dark{--bg:#0a0e1a;--card:#141b2d;--txt:#f1f5f9;--muted:#94a3b8;--bd:#1e293b;}
        *{font-family:'Tajawal',sans-serif;box-sizing:border-box}
        body{background:var(--bg);color:var(--txt);transition:.4s}
        .page{display:none}.page.active{display:block;animation:slideUp.5s cubic-bezier(.16,1,.3,1)}
        @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .glass{background:rgba(255,255,255,.75);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.2)}
        .btn{padding:.875rem 1.5rem;border-radius:1rem;font-weight:700;transition:all.3s;cursor:pointer;border:none}
        .btn-p{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
        .card{background:var(--card);border-radius:1.5rem;border:1px solid var(--bd);box-shadow:0 10px 40px -10px rgba(0,0,0,.1)}
        .badge-verified{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:.2rem .5rem;border-radius:99px;font-size:0.7rem}
        #toast { position:fixed; top:20px; right:20px; z-index:9999; padding:1rem 2rem; border-radius:1rem; color:white; font-weight:bold; transform:translateX(200%); transition:0.5s; }
        #toast.show { transform:translateX(0); }
    </style>
</head>
<body>

<div id="toast"></div>

<nav class="sticky top-0 z-50 glass shadow-xl">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-4 cursor-pointer" onclick="showPage('feed')">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center text-white font-black text-2xl">N</div>
            <div class="font-black text-xl">NAS Markets</div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="showPage('feed')" class="nav-link">الرئيسية</button>
            <button onclick="showPage('jobs')" class="nav-link">المهن</button>
            <button onclick="showPage('asma')" class="nav-link">أسماء AI</button>
            <img id="userAvatar" class="w-11 h-11 rounded-2xl border-2 border-indigo-500 cursor-pointer" onclick="login()">
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto p-4">
    <div id="feedPage" class="page active">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-black">السوق الذكي</h2>
            <button onclick="openPostModal()" class="btn btn-p">انشر إعلان (10 أوقية)</button>
        </div>
        <div id="feedGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </div>

    <div id="jobsPage" class="page">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-black">دليل المهن</h2>
            <button onclick="openJobModal()" class="btn btn-p">أضف مهنتك (500 أوقية)</button>
        </div>
        <div id="jobsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <div id="asmaPage" class="page">
        <div class="card p-6 h-[500px] flex flex-col">
            <div id="chatBox" class="flex-1 overflow-y-auto mb-4 space-y-3"></div>
            <div class="flex gap-2">
                <input id="chatInput" class="flex-1 p-3 border rounded-xl" placeholder="اسأل أسماء...">
                <button onclick="sendToAsma()" class="btn btn-p">إرسال</button>
            </div>
        </div>
    </div>

    <div id="adminPage" class="page">
        <h2 class="text-3xl font-black mb-6">لوحة التحكم</h2>
        <div id="adminList" class="space-y-4"></div>
    </div>
</main>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, orderBy, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    // الإعدادات مدمجة
    const GEMINI_KEY = 'AIzaSyC7y3nM5rqXBKSDiA_OHlIz1M3PVd3XABs';
    const MY_PHONE = '33300817'; 
    const firebaseConfig = { apiKey: "AIzaSyAcJUNqUCKaXRct1_2zYFeRtpkyofFoGLQ", authDomain: "nas-market.firebaseapp.com", projectId: "nas-market" };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    // --- وظائف التنبيه ---
    window.toast = (m, type='ok') => {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.backgroundColor = type==='ok'?'#10b981':'#ef4444';
        t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000);
    };

    // --- نظام الدخول ---
    window.login = async () => {
        const provider = new GoogleAuthProvider();
        try { const r = await signInWithPopup(auth, provider); toast(`أهلاً ${r.user.displayName}`); } 
        catch(e) { toast("خطأ في الدخول", 'err'); }
    };

    onAuthStateChanged(auth, u => { 
        currentUser = u; 
        if(u) document.getElementById('userAvatar').src = u.photoURL;
    });

    // --- خوارزمية عرض المنتجات (ترتيب الموثقين أولاً) ---
    function renderFeed(listings) {
        const grid = document.getElementById('feedGrid');
        // ترتيب: الموثقين أولاً، ثم حسب التاريخ
        const sorted = listings.sort((a, b) => (b.isVerified === a.isVerified) ? b.createdAt - a.createdAt : b.isVerified ? 1 : -1);
        grid.innerHTML = sorted.map(l => `
            <div class="card p-4">
                <img src="${l.img || 'https://via.placeholder.com/150'}" class="rounded-xl h-40 w-full object-cover mb-3">
                <h3 class="font-bold">${l.title} ${l.isVerified ? '<span class="badge-verified">موثق ✓</span>' : ''}</h3>
                <p class="text-indigo-600 font-black">${l.price} MRU</p>
                <a href="https://wa.me/${l.phone}" class="block text-center mt-3 p-2 bg-green-500 text-white rounded-lg">واتساب</a>
            </div>
        `).join('');
    }

    // --- نظام التوثيق (للمشرف) ---
    window.verifyUser = async (userId) => {
        // منطق تحديث حالة التوثيق في Firestore
        toast("تم توثيق الحساب بنجاح!");
    };

    // --- نظام النشر (بـ 10 أوقية) ---
    window.openPostModal = () => {
        const title = prompt("عنوان المنتج:");
        const price = prompt("السعر:");
        if(title && price) {
            alert(`يرجى تحويل 10 أوقية قديمة للرقم ${MY_PHONE} وإرسال الصورة للمشرف`);
            addDoc(collection(db, "listings"), {
                title, price, userId: currentUser.uid, status: 'pending', createdAt: serverTimestamp()
            });
            toast("تم الإرسال للمراجعة");
        }
    };

    // --- نظام أسماء AI ---
    window.sendToAsma = async () => {
        const input = document.getElementById('chatInput');
        const box = document.getElementById('chatBox');
        if(!input.value) return;
        box.innerHTML += `<p class="text-right"><b>أنت:</b> ${input.value}</p>`;
        
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: `أنت أسماء 1، مساعدة موقع NAS Markets. أجيبي باختصار. السؤال: ${input.value}` }] }] })
            });
            const d = await res.json();
            box.innerHTML += `<p class="text-left text-purple-600"><b>أسماء:</b> ${d.candidates[0].content.parts[0].text}</p>`;
        } catch(e) { toast("خطأ في AI", 'err'); }
        input.value = '';
    };

    // تبديل الصفحات
    window.showPage = (p) => {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.getElementById(p + 'Page').classList.add('active');
    };

    // جلب البيانات لحظياً
    onSnapshot(query(collection(db, "listings"), where("status", "==", "approved")), snap => {
        renderFeed(snap.docs.map(d => ({id: d.id, ...d.data()})));
    });

</script>
</body>
</html>
